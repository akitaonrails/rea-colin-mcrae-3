name: mirror

# Publishes the exact, checksum-validated third-party downloads marked
# `mirror` in packaging/third-party.txt (the vkBasalt source included) to
# this repository's own `thirdparty` release, so builds keep working if an
# upstream moves, breaks or disappears (each pin falls back to its mirror
# url). The SDK's reusable workflow never deletes the release; it uploads
# each file under the pin's own file name. Run after adopting a new pin.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    permissions:
      contents: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/mirror.yml@v0.2.0
