name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-binaries:
    name: Test and build the Windows package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the build toolchains
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-multilib \
            glslang-tools libvulkan-dev spirv-headers libx11-dev libx11-dev:i386 \
            meson ninja-build pkg-config zip

      - name: Install Rust (with the 32-bit Windows target)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add i686-pc-windows-gnu

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Unit tests (host)
        run: cargo test --workspace

      - name: Linux helper tests (GPU choice, gamescope args, post-processing)
        run: sh linux/tests/gpu-env.sh && sh linux/tests/scaler.sh && sh linux/tests/postfx.sh

      - name: Lint (Windows target)
        run: cargo clippy --release --target i686-pc-windows-gnu --workspace -- -D warnings

      - name: Build CMR3Launcher.exe
        run: cargo build --release --target i686-pc-windows-gnu --workspace

      - name: Fetch and verify the bundled components
        run: |
          # A component's line in packaging/third-party.txt is
          # `name sha256-checked-url sha256 fallback-url…`: the first url
          # whose download matches the checksum wins, so a moved or
          # deleted upstream never breaks a build once the mirror exists.
          pins() { grep -v '^#' packaging/third-party.txt | grep .; }
          sha_of() { pins | awk -v n="$1" '$1 == n { print $3 }'; }
          fetch() { # name file — every url on the line, in order
            sha=$(sha_of "$1")
            for url in $(pins | awk -v n="$1" '$1 == n { for (i = 2; i <= NF; i++) if (i != 3) print $i }'); do
              echo "::group::$1 from ${url##*/}"
              if curl -fsSL --retry 2 "$url" -o "$2.part" \
                 && echo "$sha  $2.part" | sha256sum -c -; then
                mv "$2.part" "$2"; echo "::endgroup::"; return 0
              fi
              echo "unavailable or checksum mismatch: $url"; echo "::endgroup::"
            done
            echo "no source for $1 matched sha256 $sha"; return 1
          }
          mkdir -p thirdparty/silentpatch thirdparty/xidi thirdparty/patcher thirdparty/dxvk
          fetch silentpatch SilentPatch.zip
          fetch patcher CMR3Patcher.zip
          fetch xidi Xidi.zip
          fetch hd-ui hd-ui.zip
          fetch dxvk dxvk.tar.gz
          fetch vkbasalt vkbasalt.tar.gz
          unzip -qo SilentPatch.zip -d sp
          unzip -qo CMR3Patcher.zip -d patcher-x
          unzip -qo Xidi.zip -d xidi-x
          unzip -qo hd-ui.zip -d thirdparty/hd-ui
          tar -xzf vkbasalt.tar.gz
          cp sp/SilentPatchCMR3.asi sp/dinput8.dll sp/ReadMe.txt thirdparty/silentpatch/
          cp patcher-x/patcher/xdelta.exe patcher-x/patcher/efigs.xdelta \
             patcher-x/patcher/polish.xdelta patcher-x/ReadMe-Patcher.txt thirdparty/patcher/
          cp xidi-x/Xidi-v4.3.1/Win32/dinput8.dll thirdparty/xidi/
          cp xidi-x/Xidi-v4.3.1/LICENSE thirdparty/xidi/LICENSE
          tar -xzf dxvk.tar.gz --strip-components=2 -C thirdparty/dxvk dxvk-3.1.1/x32/d3d9.dll
          echo "$(sha_of dxvk-d3d9-sha256)  thirdparty/dxvk/d3d9.dll" \
            | sha256sum -c -
          cp packaging/licenses/DXVK-LICENSE thirdparty/dxvk/LICENSE
          cp packaging/licenses/SilentPatchCMR3-LICENSE thirdparty/silentpatch/LICENSE
          cp packaging/licenses/xdelta3-LICENSE thirdparty/patcher/LICENSE
          cp packaging/licenses/Xidi-LICENSE packaging/licenses/Xidi-Hookshot-LICENSE thirdparty/xidi/

      - name: Build both vkBasalt layer bitnesses
        run: |
          # The postfx layer, from the pinned source: both bitnesses ship —
          # a WoW64 prefix loads the 64-bit Vulkan loader even for its
          # 32-bit game, so each process finds its own library.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib meson ninja-build \
            glslang-tools pkg-config libx11-dev libx11-dev:i386 \
            libvulkan-dev libvulkan-dev:i386
          packaging/build-vkbasalt.sh vkBasalt-*/ thirdparty/vkbasalt

      - name: Package
        run: |
          name=CMR3Launcher-${GITHUB_REF_NAME//\//-}
          mkdir -p "dist/$name"
          cp target/i686-pc-windows-gnu/release/CMR3Launcher.exe \
             README.md CHANGELOG.md THIRD_PARTY.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          mkdir -p "dist/$name/docs"
          cp -r docs/images "dist/$name/docs/images"
          cp docs/ENHANCEMENTS.md "dist/$name/docs/"
          cp -r thirdparty "dist/$name/thirdparty"
          cp -r linux "dist/$name/linux"
          (cd dist && zip -r "$name.zip" "$name")
          echo "PACKAGE=dist/$name.zip" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=dist/$name" >> "$GITHUB_ENV"
          echo "APPIMAGE=dist/$name-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build the Linux AppImage (with a portable Wine)
        run: |
          packaging/appimage/build.sh "$PACKAGE_DIR" dist/appimage
          mv dist/appimage/CMR3Launcher-x86_64.AppImage "$APPIMAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CMR3Launcher-windows
          path: ${{ env.PACKAGE }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CMR3Launcher-linux
          path: ${{ env.APPIMAGE }}

  release:
    name: Publish a release for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: CMR3Launcher-*
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md ./*.zip ./*.AppImage
