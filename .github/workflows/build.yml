name: build

# Checks, the Windows build and both packages through the SDK's reusable
# workflows (rea-launcher-sdk, pinned by tag; sdk/VERSION must match);
# version tags publish a release with the tag's CHANGELOG section.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.4.1
    with:
      # The MinGW linker, zip, and the vkBasalt build (both bitnesses).
      apt-i386: true
      apt-packages: >-
        gcc-mingw-w64-i686 zip unzip gcc-multilib g++-multilib meson
        ninja-build pkg-config glslang-tools spirv-headers libx11-dev
        libx11-dev:i386 libvulkan-dev libvulkan-dev:i386
      # The Windows-target tests (settings window included), headless
      # under Wine.
      wine-tests: true
      # linux/tests/e2e.sh needs the dev kit and a game (skipped unless CMR3_E2E=1).
      shell-tests: linux/tests/*.sh
      package-command: |
        packaging/package.sh "$REA_VERSION_NAME" "$REA_RELEASE_DIR" dist "$REA_CACHE"
      package-dir: dist/CMR3Launcher-*/ dist/CMR3Launcher-*.zip
      package-allowlist: packaging/package.allow
      artifact-name: CMR3Launcher-packages
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.4.1
    with:
      package: cmr3-launcher
      artifact-pattern: CMR3Launcher-*
