name: watch-upstream

# Keeps the third-party pins honest without ever adopting an update
# silently: every week (and on demand) the SDK's upstream-watch resolves
# each component's latest release (packaging/upstream-watch.txt) and
# compares it with the pinned checksum in packaging/third-party.txt. A
# difference opens one issue per component (commented on while open) —
# moving the pin is a human decision made in a PR, after a run against
# the game.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    permissions:
      contents: read
      issues: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/upstream-watch.yml@v0.8.2
    with:
      pins: packaging/third-party.txt
      watch-list: packaging/upstream-watch.txt
