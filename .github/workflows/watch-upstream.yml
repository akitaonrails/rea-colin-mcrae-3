name: watch-upstream

# Keeps the third-party pins honest without ever adopting an update
# silently: every week (and on demand) this resolves each component's
# latest release and compares it with the pinned checksum in
# packaging/third-party.txt. A difference opens one issue per component
# (updated in place while open) — moving the pin is a human decision made
# in a PR, after a run against the game.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check upstream for new releases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare upstream latest with our pins
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(mktemp)
          while read -r name repo prefix; do
            [ -n "$name" ] || continue
            pinned=$(grep -v '^#' packaging/third-party.txt | awk -v n="$name" '$1 == n { print $3 }')
            [ -n "$pinned" ] || continue
            latest=$(gh api "repos/$repo/releases/latest" 2>/dev/null) || {
              echo "$name unreachable: repo $repo" >> "$report"; continue; }
            tag=$(echo "$latest" | jq -r .tag_name)
            url=$(echo "$latest" | jq -r ".assets[] | select(.name | startswith(\"$prefix\")) | .browser_download_url" | head -1)
            [ -n "$url" ] || { echo "$name: no asset matching '$prefix' in $repo@$tag" >> "$report"; continue; }
            curl -fsSL --retry 2 --max-time 300 "$url" -o latest.tmp || {
              echo "$name: download failed: $url" >> "$report"; continue; }
            now=$(sha256sum latest.tmp | cut -d' ' -f1)
            if [ "$now" != "$pinned" ]; then
              echo "$name changed: pinned $pinned, upstream $tag is $now ($url)" >> "$report"
            else
              echo "$name unchanged ($tag)"
            fi
          done < <(grep -v '^#' packaging/upstream-watch.txt | grep .)
          {
            echo "report<<EOF"
            cat "$report"
            echo "EOF"
            echo "changed=$(grep -q . "$report" && echo 1 || echo 0)"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update an issue per changed component
        if: steps.check.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.check.outputs.report }}" > report.txt
          while read -r line; do
            name=$(echo "$line" | cut -d' ' -f1)
            title="third-party update: $name"
            existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)
            body=$(printf '%s\n\n%s\n' "$line" \
              "The pinned checksum is in \`packaging/third-party.txt\`. To adopt the new release: play a stage with it, then update the pin and refresh the mirror (the mirror workflow) in a PR.")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$line"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done < report.txt
