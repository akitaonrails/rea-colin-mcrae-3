name: Bug or unknown game version
description: Something about Colin McRae Rally 3 or this launcher doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Problems with the shared parts (the settings window's
        widgets, the runtime folder, rea-play.sh, packaging, CI) belong in
        https://github.com/akitaonrails/rea-launcher-sdk/issues — if you're not sure,
        report here and we'll move it. Never attach game files.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256 of Rally_3PC.exe
      description: >-
        `CMR3Launcher --check` prints it; it is also on the `game:` line of
        launcher.log. Needed when the launcher refused your version.
  - type: dropdown
    id: platform
    attributes:
      label: Where you play
      options:
        - Windows
        - Linux (AppImage or cmr3-play)
        - Steam Deck
        - Proton/Wine without cmr3-play
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, or the release you downloaded.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: >-
        Windows: %LOCALAPPDATA%\CMR3Launcher\launcher.log. Linux: inside the Wine
        prefix, ~/.local/share/cmr3-launcher/prefix/drive_c/users/<you>/AppData/Local/CMR3Launcher/launcher.log
        (plus ~/.config/cmr3-launcher/play.log and settings.log).
      render: text
    validations:
      required: true
