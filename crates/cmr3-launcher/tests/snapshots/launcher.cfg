# Colin McRae Rally 3 launcher settings.
#
# One setting per line as key = value; lines starting with # are comments. A
# setting left unset keeps the game's own value (or the default named).
# Command-line options (--resolution 1920x1080, ...) override this file for
# one run. A launcher.cfg next to CMR3Launcher.exe is used instead of this
# one when it exists (portable installs).

# The folder with your installed Rally_3PC.exe. It is only read, never
# changed. Remembered once given.
# Values: a folder or file.
#game =

# Where your profile (the game's CMR3 file) is kept: copied into the game
# before it starts and back when it ends. Default: Saved Games\Colin McRae
# Rally 3.
# Values: a folder or file.
#saves =

# Where the launcher keeps its private, writable copy of the game (about 3
# GB; hard-linked when it can be). Default:
# %LOCALAPPDATA%\CMR3Launcher\Rally3.
# Values: a folder or file.
#runtime =

# The game's screen size; original is the 640×480 of 2003. Unset: your
# desktop's size. Wider screens show more to the sides, unstretched.
# Values: WIDTHxHEIGHT or original.
#resolution = 1920x1080

# Fullscreen fills the screen; windowed and borderless play in a window on
# the desktop.
# Values: fullscreen, windowed or borderless.
#display_mode =

# Waits for the screen's refresh before showing each frame: no tearing.
# Unset keeps the game's own choice.
# Values: on or off.
#vsync =

# Anisotropic filtering: keeps the road surface sharp into the distance.
# Unset keeps the game's.
# Values: off, 2, 4, 8 or 16.
#anisotropic =

# Anti-aliasing: smooths the jagged edges of cars and scenery; costs speed
# at 4K. Unset keeps the game's.
# Values: on or off.
#fsaa =

# How wide the camera sees, in degrees, for both cameras (rounded down to a
# step of 5). The game's own is 75; wider screens already show more to the
# sides.
# Values: 30 to 150.
#fov = 75

# Sharp: the crisper 2005 shadows. Soft: the blurrier 2003 ones. Unset keeps
# the game's.
# Values: sharp or soft.
#shadows =

# Bekoha's HD UI: fonts, menus and race graphics redrawn for 4K.
# Values: on or off.
#hd_ui =

# Rally: the triggers are the pedals, and the d-pad and A also work the
# menus. Standard: the pad as it reports itself. Off: the game's own
# DirectInput.
# Values: rally, standard or off.
#gamepad =

# Records what the game asks of the pad and what every button and stick sent
# (Xidi's log, beside the game in the runtime folder); for reporting a
# button that doesn't arrive.
# Values: on or off.
#gamepad_log =

# Linux and Wine only: draws through Vulkan instead of Wine's OpenGL
# translator, full speed instead of about 10 FPS at 4K. On unless set off;
# ignored on Windows.
# Values: on or off.
#dxvk =

# Linux only: how gamescope enlarges the picture to your screen. Sharp:
# crisp blocks. Even pixels: crisp, all the same size. FSR: smoothed, then
# sharpened. Smooth: the softest.
# Values: nearest, pixel, fsr or linear.
#scaler =

# Linux only, needs DXVK: a colour grade over the finished frame. Colour:
# real blacks, fuller contrast and sharpening. Cinematic: a stronger grade.
# Values: off, color or cinematic.
#postfx =
