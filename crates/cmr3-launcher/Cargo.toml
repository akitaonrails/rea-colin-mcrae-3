[package]
name = "cmr3-launcher"
version = "0.1.2"
edition.workspace = true
# The settings window's eframe needs 1.95.
rust-version = "1.95"
license.workspace = true
description = "Runs the user's own copy of Colin McRae Rally 3 (2003, PC) on modern Windows and under Proton/Wine"

[[bin]]
name = "CMR3Launcher"
path = "src/main.rs"

[dependencies]
md-5.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
