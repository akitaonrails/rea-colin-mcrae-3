[package]
name = "cmr3-launcher"
version = "0.1.2"
edition.workspace = true
# The settings window's eframe needs 1.95.
rust-version = "1.95"
license.workspace = true
description = "Runs the user's own copy of Colin McRae Rally 3 (2003, PC) on modern Windows and under Proton/Wine"

[[bin]]
name = "CMR3Launcher"
path = "src/main.rs"

[dependencies]
md-5.workspace = true
rea-launcher.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
rea-launcher-win32.workspace = true
rea-launcher-ui.workspace = true

[dev-dependencies]
# The settings window's look (palette, design size) is tested on the host.
rea-launcher-ui.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow"] }
