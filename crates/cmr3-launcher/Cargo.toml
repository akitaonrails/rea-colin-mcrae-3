[package]
name = "cmr3-launcher"
version = "0.5.0"
edition.workspace = true
# The settings window's eframe needs 1.95.
rust-version = "1.95"
license.workspace = true
description = "Runs the user's own copy of Colin McRae Rally 3 (2003, PC) on modern Windows and under Proton/Wine"

[features]
# Builds rea_dinput.dll with its DllMain and exports, for the package only
# (Cargo can't take features for a dependency on the command line):
#   cargo build --profile dll --lib -p cmr3-launcher -p rea-launcher-dinput
#     --features layer-dlls --target i686-pc-windows-gnu
# --lib keeps the launcher exe out of that build.
layer-dlls = ["rea-launcher-dinput/dll"]

[[bin]]
name = "CMR3Launcher"
path = "src/main.rs"

[dependencies]
md-5.workspace = true
rea-launcher.workspace = true
rea-launcher-dinput.workspace = true

[target.'cfg(windows)'.dependencies]
rea-launcher-win32.workspace = true
rea-launcher-ui.workspace = true

[build-dependencies]
# Version information, icon and manifest in CMR3Launcher.exe (build.rs).
rea-launcher-build.workspace = true

[dev-dependencies]
# The settings window is tested headless (egui_kittest), on the host and
# under Wine.
rea-launcher-ui = { workspace = true, features = ["testing"] }
# report's routing table (`audience`) is tested on the host too.
rea-launcher-win32.workspace = true
