[workspace]
members = ["crates/cmr3-launcher"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
md-5 = "0.11"
# The shared launcher SDK; bump the tag here and rerun scripts/sdk-sync.
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.5.0" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.5.0" }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.5.0" }
rea-launcher-build = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.5.0" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
