[workspace]
members = ["crates/cmr3-launcher"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
md-5 = "0.11"
# The shared launcher SDK; bump the tag here and rerun scripts/sdk-sync.
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }
rea-launcher-build = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true

# TEMPORARY: the SDK's feat/dinput-wheel branch (wheel tab, DirectInput
# devices, the rea_dinput layer) until v0.9.0 is tagged; then delete this
# table and bump the tags above with sdk-bump.
[patch."https://github.com/akitaonrails/rea-launcher-sdk"]
rea-launcher = { path = "/mnt/data/Projects/rea-launcher-sdk/crates/rea-launcher" }
rea-launcher-win32 = { path = "/mnt/data/Projects/rea-launcher-sdk/crates/rea-launcher-win32" }
rea-launcher-ui = { path = "/mnt/data/Projects/rea-launcher-sdk/crates/rea-launcher-ui" }
rea-launcher-build = { path = "/mnt/data/Projects/rea-launcher-sdk/crates/rea-launcher-build" }
