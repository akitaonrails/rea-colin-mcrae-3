[workspace]
members = ["crates/cmr3-launcher"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
md-5 = "0.11"
# The shared launcher SDK; bump the tag here and rerun scripts/sdk-sync.
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
rea-launcher-build = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
# The in-game DirectInput wheel layer: its rlib, without the DLL's own
# DllMain and exports, gives the launcher `import_into` and the names.
# rea_dinput.dll is built for the package with the launcher's
# `layer-dlls` feature (crates/cmr3-launcher/Cargo.toml).
rea-launcher-dinput = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true

# The in-game wheel layer's DLL (rea_dinput.dll): its catch_unwind guards
# turn a panic into an error code for one DirectInput call, never a crash
# in the game; that needs unwinding. The launcher exe keeps abort.
[profile.dll]
inherits = "release"
panic = "unwind"
